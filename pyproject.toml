[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"
[project]
name = "har-subject-shift"
version = "0.1.0"
description = "Auditable subject-independent human activity recognition experiment"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "pandas>=2.1,<3", "scipy>=1.11,<2", "scikit-learn>=1.5,<2", "matplotlib>=3.8,<4", "joblib>=1.3,<2", "requests>=2.31,<3", "psutil>=5.9,<9", "nbformat>=5.9,<6", "nbconvert>=7.14,<8"]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ipykernel>=6,<8"]
[project.scripts]
har-shift = "har_subject_shift.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
